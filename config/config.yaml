correlation:
  threshold: 0.65
  window: 96
  timeframe_windows:
    H4: 96
    H1: 384
    M15: 1536
  short_window: 24
  stability_segments: 4
  minimum_stability: 0.70
  maximum_regime_drift: 0.25
  method: pearson
  min_observations: 60
  primary_requires_threshold: true

timeframes:
  primary: H4
  confirmation: [H1, M15]

pairs: [EURUSD, GBPUSD, USDJPY, USDCHF, AUDUSD, NZDUSD, USDCAD, EURGBP, EURJPY, GBPJPY, AUDJPY, CHFJPY]

scoring:
  correlation_weight: 40
  h4_weight: 25
  h1_weight: 20
  m15_weight: 15
  minimum_alert_score: 65
  minimum_confluence: H4_ONLY

strategy:
  timeframe: M15
  stop_loss_pct: 0.0025
  tp1_pct: 0.0050
  tp2_pct: 0.0100
  trailing_stop_pct: 0.0025
  tp1_size: 0.50
  max_bars: 96
  spread_window: 96
  z_entry: 1.5

alerts:
  enabled: false
  console: true

data:
  provider: yahoo_chart
  period_days: 59
  request_timeout_seconds: 20
  minimum_available_pairs: 8
