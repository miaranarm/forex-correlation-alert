name: Forex Signal Strategy Backtest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "config/**"
      - "tests/**"
      - ".github/workflows/forex-strategy-backtest.yml"
      - "requirements.txt"
  schedule:
    - cron: "45 3 * * *"

permissions:
  contents: write

jobs:
  strategy-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Run executable strategy backtest
        run: python -m forex_alert.strategy_backtest
      - name: Evaluate strategy gate
        shell: python
        run: |
          import json
          from pathlib import Path
          p = json.loads(Path("results/strategy_backtest_summary.json").read_text())
          oos = p["out_of_sample"]
          checks = {
              "minimum_oos_trades": oos.get("trades", 0) >= 50,
              "minimum_oos_profit_factor": oos.get("profit_factor") is not None and oos["profit_factor"] >= 1.0,
              "positive_oos_expectancy": oos.get("expectancy_r", 0) > 0,
          }
          enabled = all(checks.values())
          gate = {
              "enabled": enabled,
              "validated_at": __import__("datetime").datetime.now(__import__("datetime").timezone.utc).isoformat(),
              "checks": checks,
              "oos": oos,
          }
          Path("results/strategy_gate.json").write_text(json.dumps(gate, indent=2), encoding="utf-8")
          print(json.dumps(gate, indent=2))
      - name: Persist strategy gate
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/strategy_gate.json
          git diff --cached --quiet || git commit -m "chore: update strategy validation gate"
          git push
      - name: Validate out-of-sample robustness
        shell: python
        run: |
          import json
          from pathlib import Path
          p = json.loads(Path("results/strategy_gate.json").read_text())
          if not p["enabled"]:
              raise SystemExit("FAIL: strategy validation gate is closed")
      - name: Upload strategy backtest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forex-signal-strategy-backtest
          path: results/strategy_backtest_*
          if-no-files-found: error
