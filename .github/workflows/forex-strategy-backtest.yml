name: Forex Signal Strategy Backtest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "config/**"
      - "tests/**"
      - ".github/workflows/forex-strategy-backtest.yml"
      - "requirements.txt"
  schedule:
    - cron: "45 3 * * *"

permissions:
  contents: read

jobs:
  strategy-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Run executable strategy backtest
        run: python -m forex_alert.strategy_backtest
      - name: Validate out-of-sample robustness
        shell: python
        run: |
          import json
          from pathlib import Path
          p = json.loads(Path("results/strategy_backtest_summary.json").read_text())
          oos = p["out_of_sample"]
          if oos.get("trades", 0) < 50:
              raise SystemExit(f"FAIL: insufficient OOS trades: {oos.get('trades', 0)}")
          if oos.get("profit_factor") is None or oos["profit_factor"] < 1.0:
              raise SystemExit(f"FAIL: OOS profit factor {oos.get('profit_factor')}")
          if oos.get("expectancy_r", 0) <= 0:
              raise SystemExit(f"FAIL: OOS expectancy {oos.get('expectancy_r')}")
      - name: Upload strategy backtest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forex-signal-strategy-backtest
          path: results/strategy_backtest_*
          if-no-files-found: error
