name: Forex Signal Strategy Backtest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "config/**"
      - "tests/**"
      - ".github/workflows/forex-strategy-backtest.yml"
      - "requirements.txt"
  schedule:
    - cron: "45 3 * * *"

permissions:
  contents: read

jobs:
  strategy-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Run executable strategy backtest
        run: python -m forex_alert.strategy_backtest
      - name: Upload strategy backtest
        uses: actions/upload-artifact@v4
        with:
          name: forex-signal-strategy-backtest
          path: results/strategy_backtest_*
          if-no-files-found: error
