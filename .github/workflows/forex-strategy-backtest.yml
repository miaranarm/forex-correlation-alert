name: Forex Signal Strategy Backtest
# Trigger strategy validation with the current long-history Dukascopy configuration.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "config/**"
      - "tests/**"
      - ".github/workflows/forex-strategy-backtest.yml"
      - "requirements.txt"
  schedule:
    - cron: "45 3 * * *"

permissions:
  contents: write

concurrency:
  group: forex-correlation-automation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  strategy-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Install historical data client
        run: npm install --no-audit --no-fund
      - run: pytest -q
      - name: Run executable strategy backtest
        run: python -m forex_alert.strategy_backtest
      - name: Evaluate strategy gate
        shell: python
        run: |
          import json
          from pathlib import Path
          from datetime import datetime, timezone
          p = json.loads(Path("results/strategy_backtest_summary.json").read_text())
          test = p["test"]
          holdout = p["holdout"]
          checks = {
              "minimum_test_trades": test.get("trades", 0) >= 10,
              "minimum_test_profit_factor": test.get("profit_factor") is not None and test["profit_factor"] >= 1.0,
              "positive_test_expectancy": test.get("expectancy_r", 0) > 0,
              "minimum_holdout_trades": holdout.get("trades", 0) >= 10,
              "minimum_holdout_profit_factor": holdout.get("profit_factor") is not None and holdout["profit_factor"] >= 1.0,
              "positive_holdout_expectancy": holdout.get("expectancy_r", 0) > 0,
          }
          enabled = all(checks.values())
          gate = {
              "enabled": enabled,
              "validated_at": datetime.now(timezone.utc).isoformat(),
              "checks": checks,
              "test": test,
              "holdout": holdout,
          }
          Path("results/strategy_gate.json").write_text(json.dumps(gate, indent=2), encoding="utf-8")
          print(json.dumps(gate, indent=2))
      - name: Persist strategy gate
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/strategy_gate.json
          git diff --cached --quiet || git commit -m "chore: update strategy validation gate"
          git pull --rebase origin main
          git push
      - name: Report validation status
        shell: python
        run: |
          import json
          from pathlib import Path
          p = json.loads(Path("results/strategy_gate.json").read_text())
          print(json.dumps(p, indent=2))
      - name: Upload strategy backtest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forex-signal-strategy-backtest
          path: results/strategy_backtest_*
          if-no-files-found: error
