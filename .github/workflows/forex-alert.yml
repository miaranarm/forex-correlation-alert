name: Forex Correlation Alert

on:
  push:
    branches:
      - main
    paths-ignore:
      - "results/**"
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: forex-correlation-alert-${{ github.ref }}
  cancel-in-progress: true

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Run correlation alert engine
        run: python -m forex_alert.main
        env:
          PYTHONPATH: src

      - name: Persist alert state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/alert_state.json
          git diff --cached --quiet || git commit -m "chore: update alert state"
          git pull --rebase origin main
          git push

      - name: Upload alert report
        uses: actions/upload-artifact@v4
        with:
          name: forex-alert-report
          path: results/
          if-no-files-found: warn
